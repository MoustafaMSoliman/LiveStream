services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    command: ["sh", "-c", "apk add --no-cache bash && /mediamtx"] # Install bash, then run MediaMTX
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    restart: unless-stopped