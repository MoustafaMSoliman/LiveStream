# RTSP Configuration
rtspAddress: :8554
rtspTransports: [tcp, udp]
#rtspReadTimeout: 60s
#rtspWriteTimeout: 60s
writeQueueSize: 2048


# RTMP Configuration
rtmpAddress: :1935

# HLS Configuration
hlsAddress: :8888

# WebRTC Configuration (WHIP/WHEP)
webrtcAddress: :8889
#webrtcAllowOrigin: "*"

authMethod: http
authHTTPAddress: http://host.docker.internal:5046/api/stream/validate-token

authInternalUsers: []

# Enable JWT token support in query parameters
authJWTInHTTPQuery: true
   



