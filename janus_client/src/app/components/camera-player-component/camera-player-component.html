<div class="p-3">
  <h2>🎥 Stream Viewer</h2>

  <div *ngIf="accessibleDevices.length > 0; else noDevices">
    <ul class="device-list">
      <li *ngFor="let device of accessibleDevices" (click)="startStream(device)">
        {{ device.name }} - {{ device.status }}
      </li>
    </ul>
  </div>

  <ng-template #noDevices>
    <p>No accessible devices found.</p>
  </ng-template>

  <div *ngIf="streamInfo">
    <h3>{{ streamInfo.deviceName }}</h3>
    <video id="video" controls autoplay muted playsinline style="width: 100%; max-height: 500px;"></video>
  </div>
</div>
