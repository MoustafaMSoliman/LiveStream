<div class="camera-player">
  <div class="controls">
    <select [ngModel]="streamMode" (ngModelChange)="streamMode = $event">
      <option value="webrtc">WebRTC</option>
      <option value="hls">HLS</option>
    </select>
    <button (click)="play()" [disabled]="isPlaying">▶️ Play</button>
    <button (click)="stop()" [disabled]="!isPlaying">⏹ Stop</button>
  </div>

  <video
    #videoElement
    width="320"
    height="180"
    controls
    autoplay
    muted
    playsinline>
  </video>

  <div *ngIf="error" class="error">{{ error }}</div>
</div>
