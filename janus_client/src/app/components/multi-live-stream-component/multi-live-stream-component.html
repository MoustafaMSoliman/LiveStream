<div class="toolbar">
  <label>Stream Mode:</label>
  <select [(ngModel)]="streamMode">
    <option value="webrtc">WebRTC</option>
    <option value="hls">HLS</option>
  </select>

  <button (click)="playAll()" [disabled]="isPlaying">▶️ Play All</button>
  <button (click)="stopAll()" [disabled]="!isPlaying">⏹ Stop All</button>

  <button (click)="getAllCameras()">📡 Refresh Cameras</button>
  <span class="status" *ngIf="status">{{ status }}</span>
</div>

<div class="grid-container">
  <div *ngFor="let camera of cameras; let i = index" class="camera-tile">
    <video
      #videoElement
      [id]="'video-' + camera.id"
      autoplay
      muted
      playsinline
      controls
      width="320"
      height="180">
    </video>
    <div class="label">📹 {{ camera.id }}</div>
  </div>
</div>
