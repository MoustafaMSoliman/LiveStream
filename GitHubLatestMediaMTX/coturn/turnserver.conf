# Basic configuration
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=62.241.148.115

# Realm and authentication
realm=yourcompany.com
user=mediamtx:your-strong-password-123

# Logging - استخدام stdout فقط
no-log-file
log-stdout
verbose

# Security
no-cli
no-multicast-peers
secure-stun

# TURN permissions
no-tcp-relay
stale-nonce=600

# UDP ports range
min-port=60000
max-port=60100

# Performance
no-loopback-peers
max-allocate-lifetime=3600