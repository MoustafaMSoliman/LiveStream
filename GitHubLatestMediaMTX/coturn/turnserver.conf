# Basic configuration
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=YOUR_SERVER_PUBLIC_IP

# Realm and authentication
realm=yourcompany.com
user=mediamtx:your-secret-password

# Logging
verbose
no-stdout-log

# Security
no-cli
no-multicast-peers

# TURN permissions
no-tcp-relay
stale-nonce=600

# UDP ports range
min-port=49152
max-port=65535